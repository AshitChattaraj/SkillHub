<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill Hub Pro - Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #1a0025, #2b0a3d, #3d0a5c);
    font-family: Arial, sans-serif;
    overflow:hidden;
}

/* glow circles */
body::before, body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter: blur(80px);
    opacity:0.6;
    z-index:0;
}

body::before{
    background:#a855f7;
    top:10%;
    left:10%;
}

body::after{
    background:#7c3aed;
    bottom:10%;
    right:10%;
}

/* SAME CARD WIDTH AS SIGNUP */
.card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;   /* 🔥 EXACT SAME */
    padding:30px;
    border-radius:20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 25px rgba(168,85,247,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    color:white;
    animation: fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform: translateY(20px);}
    to{opacity:1; transform: translateY(0);}
}

h3{
    text-align:center;
    margin-bottom:20px;
    color:#e9d5ff;
    font-weight:bold;
}

label{
    color:#ddd;
    font-size:14px;
}

.form-control{
    background: rgba(255,255,255,0.1);
    border:none;
    color:white;
    border-radius:12px;
}

.form-control::placeholder{
    color:#ccc;
}

.form-control:focus{
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 10px #a855f7;
    color:white;
}

/* 🔥 BUTTON SAME GAP AS SIGNUP */
.btn-purple{
    background: linear-gradient(90deg,#a855f7,#7c3aed);
    color:white;
    border:none;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s;
    margin-top:10px;   /* 🔥 SAME GAP AS SIGNUP */
}

.btn-purple:hover{
    transform: scale(1.05);
    box-shadow: 0 0 15px #a855f7;
}

a{
    color:#d8b4fe;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="card">

<h3>🔐 Login</h3>

<form id="loginForm">

    <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
    </div>

    <button id="btn" type="submit" class="btn btn-purple w-100">Login</button>
    <div class="d-flex align-items-center my-3">
    <hr class="flex-grow-1 text-light">
    <span class="mx-2 text-light">OR</span>
    <hr class="flex-grow-1 text-light">
</div>

<button id="googleLogin" type="button"
class="btn btn-light w-100 d-flex align-items-center justify-content-center gap-2 google-btn">

<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="22">

Continue with Google

</button>

</form>

<div class="text-center mt-3">
    <a href="#" onclick="resetPassword()">Forgot Password?</a> 
    <a href="signup.html">Create Account</a>
</div>
<div class="text-center mt-2">
    <a href="admin-login.html" style="font-size:13px; opacity:0.8;">🛠 Administrator Login</a>
</div>

</div>

<script type="module">
import {
    GoogleAuthProvider,
    signInWithEmailAndPassword,
    signInWithPopup,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { auth, getOrCreateUserProfile } from "./assets/js/firebase.js";

const provider = new GoogleAuthProvider();

// After any successful sign-in, look up (or create) the user's role
// profile and send them to the dashboard that matches their role.
// Admins signed up with the admin code land on admindashboard.html;
// everyone else lands on the student dashboard.html.
async function routeByRole(user) {
    const profile = await getOrCreateUserProfile(user);
    window.location.href = profile.role === "admin" ? "admindashboard.html" : "dashboard.html";
}

provider.setCustomParameters({
    prompt: "select_account"
});


// =======================
// Email Login
// =======================
document.getElementById("loginForm").addEventListener("submit", async (e)=>{

    e.preventDefault();

    const btn = document.getElementById("btn");

    btn.innerHTML = "Logging in...";
    btn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try{

        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user = userCredential.user;

        if(!user.emailVerified){

            alert("Please verify your email first.");

            btn.innerHTML="Login";
            btn.disabled=false;

            return;

        }

        sessionStorage.setItem("userName", user.displayName || "");
        sessionStorage.setItem("userEmail", user.email);

        await routeByRole(user);

    }
    catch(error){

        switch(error.code){

            case "auth/invalid-credential":
                alert("Invalid email or password.");
                break;

            case "auth/user-not-found":
                alert("User not found.");
                break;

            case "auth/wrong-password":
                alert("Wrong password.");
                break;

            case "auth/too-many-requests":
                alert("Too many attempts. Try again later.");
                break;

            default:
                alert(error.message);

        }

        btn.innerHTML="Login";
        btn.disabled=false;

    }

});


// =======================
// Google Login
// =======================
const googleBtn = document.getElementById("googleLogin");

if(googleBtn){

googleBtn.addEventListener("click", async ()=>{

    try{

        const result = await signInWithPopup(auth, provider);

        const user = result.user;

        sessionStorage.setItem("userName", user.displayName || "");
        sessionStorage.setItem("userEmail", user.email);

        await routeByRole(user);

    }
    catch(error){

        alert(error.message);

    }

});

}


// =======================
// Forgot Password
// =======================
window.resetPassword = async function(){

    const email=document.getElementById("email").value.trim();

    if(email===""){

        alert("Enter your email first.");
        return;

    }

    try{

        await sendPasswordResetEmail(auth,email);

        alert("Password reset email sent.");

    }
    catch(error){

        alert(error.message);

    }

}
</script>
</body>
</html>
