<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — SkillHub Pro</title>
    <link rel="stylesheet" href="assets/css/light-theme.css">
</head>
<body class="auth-wrapper">

<div class="auth-card">
    <div class="auth-header">
        <span class="brand-badge">🎓 Student Portal</span>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your SkillHub student account</p>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control-light" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                <a href="forgot_password.html" style="font-size: 12px; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot?</a>
            </div>
            <input type="password" id="password" class="form-control-light" placeholder="••••••••" required>
        </div>

        <div style="margin-top: 24px;">
            <button type="submit" id="btn" class="btn-primary-gradient">Sign In</button>
        </div>
    </form>

    <div class="divider">or continue with</div>

    <button type="button" id="googleLogin" class="btn-outline-light">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
        Continue with Google
    </button>

    <div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-muted);">
        Don't have an account? 
        <a href="signup.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create Account</a>
    </div>
    <div style="text-align: center; margin-top: 14px; font-size: 13px; border-top: 1px solid var(--border-color); padding-top: 14px;">
        <a href="../../admin-panel/frontend/admin-login.html" id="adminPortalLink" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">
            🛡️ Staff or Admin? <span style="color: var(--primary); font-weight: 600;">Sign in here &rarr;</span>
        </a>
    </div>
</div>
<script>
    (function() {
        const link = document.getElementById("adminPortalLink");
        if (link && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")) {
            link.href = "http://localhost:5002/admin-login.html";
        }
    })();
</script>

<script type="module">
import { 
    signInWithEmailAndPassword, 
    signInWithPopup, 
    GoogleAuthProvider,
    signOut 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { auth, getOrCreateUserProfile } from "./assets/js/firebase.js";

const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

async function routeUser(user) {
    const profile = await getOrCreateUserProfile(user);

    // If an administrator tries to log in to user portal
    if (profile.role === "admin") {
        await signOut(auth);
        alert("This account is an Administrator. Please use the Admin Portal.");
        return;
    }

    if (profile.status === "blocked") {
        await signOut(auth);
        alert("Your student account has been suspended. Please contact administration.");
        return;
    }

    // Force user to profile setup if profile or photo is not completed
    const hasPhoto = Boolean(profile.photoUrl && !profile.photoUrl.includes("flaticon.com"));
    if (profile.profileCompleted === false || !hasPhoto) {
        window.location.href = "profile-setup.html";
    } else {
        window.location.href = "dashboard.html";
    }
}

// Email Login
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn");
    btn.disabled = true;
    btn.textContent = "Signing in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        await routeUser(userCredential.user);
    } catch (error) {
        btn.disabled = false;
        btn.textContent = "Sign In";
        switch (error.code) {
            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":
                alert("Invalid email or password.");
                break;
            case "auth/too-many-requests":
                alert("Too many attempts. Please try again later.");
                break;
            default:
                alert(error.message);
        }
    }
});

// Google Login
document.getElementById("googleLogin").addEventListener("click", async () => {
    const gBtn = document.getElementById("googleLogin");
    gBtn.disabled = true;
    try {
        const result = await signInWithPopup(auth, provider);
        await routeUser(result.user);
    } catch (error) {
        gBtn.disabled = false;
        if (error.code !== "auth/popup-closed-by-user") {
            alert(error.message);
        }
    }
});
</script>

</body>
</html>
