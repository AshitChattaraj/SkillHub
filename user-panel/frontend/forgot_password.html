<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — SkillHub Pro</title>
    <link rel="stylesheet" href="assets/css/light-theme.css">
</head>
<body class="auth-wrapper">

<div class="auth-card">
    <div class="auth-header">
        <span class="brand-badge">🔒 Account Recovery</span>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a password reset link.</p>
    </div>

    <form id="resetForm">
        <div class="form-group">
            <label class="form-label" for="email">Registered Email</label>
            <input type="email" id="email" class="form-control-light" placeholder="student@example.com" required>
        </div>

        <div style="margin-top: 24px;">
            <button type="submit" id="btn" class="btn-primary-gradient">Send Reset Link</button>
        </div>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 13.5px;">
        <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">&larr; Back to Sign In</a>
    </div>
</div>

<script type="module">
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { auth } from "./assets/js/firebase.js";

document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn");
    const email = document.getElementById("email").value.trim();

    btn.disabled = true;
    btn.textContent = "Sending link...";

    try {
        await sendPasswordResetEmail(auth, email);
        alert("A password reset email has been sent to " + email);
        window.location.href = "login.html";
    } catch (error) {
        alert(error.message);
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
    }
});
</script>

</body>
</html>
