<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill Hub Pro - Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #1a0025, #2b0a3d, #3d0a5c);
    font-family: Arial, sans-serif;
    overflow:hidden;
}

/* glow */
body::before, body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    filter: blur(80px);
    opacity:0.6;
    z-index:0;
}

body::before{
    background:#a855f7;
    top:10%;
    left:10%;
}

body::after{
    background:#7c3aed;
    bottom:10%;
    right:10%;
}

/* card */
.card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    padding:30px;
    border-radius:20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 25px rgba(168,85,247,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    color:white;
}

h3{
    text-align:center;
    margin-bottom:20px;
    color:#e9d5ff;
    font-weight:bold;
}

.form-control{
    background: rgba(255,255,255,0.1);
    border:none;
    color:white;
    border-radius:12px;
}

.form-control::placeholder{
    color:#ccc;
}

.form-control:focus{
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 10px #a855f7;
    color:white;
}

/* button */
.btn-purple{
    background: linear-gradient(90deg,#a855f7,#7c3aed);
    color:white;
    border:none;
    border-radius:12px;
    font-weight:bold;
    margin-top:10px;
}

.btn-purple:hover{
    transform: scale(1.05);
    box-shadow: 0 0 15px #a855f7;
}

/* links */
.links{
    text-align:center;
    margin-top:15px;
}

a{
    color:#d8b4fe;
    text-decoration:none;
    display:block;
    margin-top:5px;
}

a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="card">

<h3>🔑 Forgot Password</h3>

<form id="forgotForm">

    <div class="mb-3">
        <label>Enter Email</label>
        <input type="email" class="form-control" placeholder="Enter your email" required>
    </div>

    <button id="btn" class="btn btn-purple w-100">Send Reset Link</button>

</form>

<!-- 🔥 NEW FLOW LINKS -->
<div class="links">
    <a href="verify_email.html">Verify Email</a>
    <a href="verify_otp.html">Verify OTP</a>
    <a href="login.html">Back to Login</a>
</div>

</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", function(){
    let btn = document.getElementById("btn");
    btn.innerHTML = "Sending...";
    btn.disabled = true;
});
</script>

</body>
</html>
