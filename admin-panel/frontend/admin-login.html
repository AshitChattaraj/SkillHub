<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login — SkillHub Pro</title>
    <link rel="stylesheet" href="assets/css/admin-light.css">
    <style>
        .auth-container {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, #eef2ff 0%, #f8fafc 90%);
            padding: 24px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: var(--radius-xl);
            padding: 38px 34px;
            box-shadow: 0 20px 45px -10px rgba(99, 102, 241, 0.12), 0 0 0 1px var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            margin-bottom: 12px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-control-light {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
            box-sizing: border-box;
        }

        .form-control-light:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn-primary-gradient {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            color: #ffffff;
            background: var(--primary-gradient);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
            transition: all 0.2s ease;
        }

        .btn-primary-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .btn-primary-gradient:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline-light {
            width: 100%;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            background: #ffffff;
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline-light:hover {
            background: var(--bg-subtle);
            border-color: #cbd5e1;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }
    </style>
</head>
<body class="auth-container">

<div class="auth-card">
    <div class="auth-header">
        <span class="brand-badge">🛠️ Administrator Access</span>
        <h1 class="auth-title">Admin Sign In</h1>
        <p class="auth-subtitle">Restricted to verified SkillHub staff and instructors</p>
    </div>

    <form id="adminLoginForm">
        <div class="form-group">
            <label class="form-label" for="email">Admin Email</label>
            <input type="email" id="email" class="form-control-light" placeholder="admin@skillhub.com" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control-light" placeholder="••••••••" required>
        </div>

        <div style="margin-top: 24px;">
            <button type="submit" id="btn" class="btn-primary-gradient">Authenticate as Admin</button>
        </div>
    </form>

    <div class="divider">or continue with</div>

    <button type="button" id="googleAdminLogin" class="btn-outline-light">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
        Sign in with Google Admin
    </button>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; font-size: 13.5px;">
        <a href="index.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">&larr; Portal Home</a>
        <a href="../../user-panel/frontend/login.html" id="toStudentPortalLink" style="color: var(--text-muted); font-weight: 500; text-decoration: none;">Student Login &rarr;</a>
    </div>
</div>

<script>
    (function() {
        const studentLink = document.getElementById("toStudentPortalLink");
        if (studentLink && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")) {
            studentLink.href = "http://localhost:5001/login.html";
        }
    })();
</script>

<script type="module">
import { 
    GoogleAuthProvider, 
    signInWithEmailAndPassword, 
    signInWithPopup, 
    signOut 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { auth, getUserProfile } from "./assets/js/firebase.js";

const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });

async function verifyAndProceed(user) {
    const profile = await getUserProfile(user.uid);
    if (!profile || profile.role !== "admin") {
        await signOut(auth);
        alert("403 Forbidden: This account does not possess administrator privileges.");
        return false;
    }
    if (profile.status === "blocked") {
        await signOut(auth);
        alert("This administrator account has been disabled. Contact system support.");
        return false;
    }
    window.location.href = "admindashboard.html";
    return true;
}

document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn");
    btn.textContent = "Verifying credentials...";
    btn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const ok = await verifyAndProceed(userCredential.user);
        if (!ok) {
            btn.textContent = "Authenticate as Admin";
            btn.disabled = false;
        }
    } catch (error) {
        btn.textContent = "Authenticate as Admin";
        btn.disabled = false;
        switch (error.code) {
            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":
                alert("Invalid email or password.");
                break;
            default:
                alert(error.message);
        }
    }
});

document.getElementById("googleAdminLogin").addEventListener("click", async () => {
    const gBtn = document.getElementById("googleAdminLogin");
    gBtn.disabled = true;
    try {
        const result = await signInWithPopup(auth, googleProvider);
        const ok = await verifyAndProceed(result.user);
        if (!ok) gBtn.disabled = false;
    } catch (error) {
        gBtn.disabled = false;
        if (error.code !== "auth/popup-closed-by-user") {
            alert(error.message);
        }
    }
});
</script>

</body>
</html>
